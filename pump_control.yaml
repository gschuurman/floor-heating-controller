#
# ESPHome Package: ESP-NOW Pump Control
#
# This package manages the pump via ESP-NOW.
# 1. Dynamically checks if any climate zone is heating and sends PUMP_ON/PUMP_OFF.
# 2. Includes an "anti-seize" feature to circulate the pump if it
#    hasn't run for a configurable interval.
#
substitutions:
  pump_mac_address: "AA:BB:CC:DD:EE:FF"
  circulation_check_interval: "24h"
  circulation_run_duration: "5min"
  valve_open_wait_duration: 65s
  pump_heartbeat_interval: 30s

espnow:
  peers:
    - ${pump_mac_address}

script:
  - id: pump_watchdog_script
    mode: restart
    then:
      - delay: ${circulation_check_interval}
      - logger.log: "Watchdog timer expired. Executing circulation script."
      - script.execute: pump_circulation_script

  - id: pump_circulation_script
    mode: single
    then:
      - script.execute: pump_watchdog_script
          
      # Channels 1+2, 3+4, ... share one BEMF sensor, so both channels of a pair must never
      # run at the same time: open the odd channels first, then the even ones.
      - logger.log: "Circulation: Opening odd channels..."
      - lambda: |-
          for (auto *cover_entity : App.get_covers()) {
            std::string name(cover_entity->get_name().c_str());
            if (name.rfind("CH", 0) == 0 && atoi(name.c_str() + 2) % 2 == 1) {
              cover_entity->make_call().set_command_open().perform();
            }
          }
      - delay: ${valve_open_wait_duration}
      - logger.log: "Circulation: Opening even channels..."
      - lambda: |-
          for (auto *cover_entity : App.get_covers()) {
            std::string name(cover_entity->get_name().c_str());
            if (name.rfind("CH", 0) == 0 && atoi(name.c_str() + 2) % 2 == 0) {
              cover_entity->make_call().set_command_open().perform();
            }
          }
      - delay: ${valve_open_wait_duration}
      
      - logger.log: "Circulation: Pump ON for ${circulation_run_duration}."
      - espnow.send:
          address: "${pump_mac_address}"
          data: "PUMP_ON"
          
      - delay: ${circulation_run_duration}

binary_sensor:
  - platform: template
    name: "Global Heat Demand"
    id: global_heat_demand
    lambda: |-
      for (auto *cover_entity : App.get_covers()) {
        if (cover_entity->position > 0.0) {
          return true;
        }
      }
      return false;
    
    on_press:
      then:
        - logger.log: "Heating Request sending PUMP_ON signal using ESP-NOW."
        - espnow.send:
            address: "${pump_mac_address}"
            data: "PUMP_ON"
        - script.execute: pump_watchdog_script
            
    on_release:
      then:
        - logger.log: "Heating request fulfilled, sending PUMP_OFF using ESP-NOW."
        - espnow.send:
            address: "${pump_mac_address}"
            data: "PUMP_OFF"
        - script.execute: pump_watchdog_script

interval:
  - interval: ${pump_heartbeat_interval}
    then:
      - if:
          condition:
            binary_sensor.is_on: global_heat_demand
          then:
            # State is ON: Send PUMP_ON
            - logger.log: "Heartbeat: State is ON. Sending PUMP_ON."
            - espnow.send:
                address: "${pump_mac_address}"
                data: "PUMP_ON"
            # Also reset the anti-seize watchdog
            - script.execute: pump_watchdog_script
          else:
            # State is OFF: Send PUMP_OFF
            - logger.log: "Heartbeat: State is OFF. Sending PUMP_OFF."
            - espnow.send:
                address: "${pump_mac_address}"
                data: "PUMP_OFF"

esphome:
  on_boot:
    priority: 800
    then:
      - logger.log: "Starting 24h pump circulation watchdog."
      - script.execute: pump_watchdog_script
      - logger.log: "Boot Check: turn on pump if the global_heat_demand is on"
      - delay: 5s
      - if:
          condition:
            binary_sensor.is_on: global_heat_demand
          then:
            - logger.log: "Boot Check: global_heat_demand is On. Force PUMP_ON."
            - espnow.send:
                address: "${pump_mac_address}"
                data: "PUMP_ON"
            # Reset ook de watchdog, want we zijn actief aan het verwarmen
            - script.execute: pump_watchdog_script

button:
  - platform: template
    name: "TEST PUMP ON"
    on_press:
      - logger.log: "Manual Test: Sending PUMP_ON"
      - espnow.send:
          address: "${pump_mac_address}" # This uses the var you already have
          data: "PUMP_ON"

  - platform: template
    name: "TEST PUMP OFF"
    on_press:
      - logger.log: "Manual Test: Sending PUMP_OFF"
      - espnow.send:
          address: "${pump_mac_address}"
          data: "PUMP_OFF"